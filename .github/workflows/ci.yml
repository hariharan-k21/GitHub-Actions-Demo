name: CI/CD Workflow

on:
  push:
    branches:
      - dev
      - stage
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          npm install

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run tests
        run: |
          npm test

      - name: Build
        run: |
          npm run build

      - name: Deploy to Development
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "Deploying to development environment"

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/stage'
        run: |
          echo "Deploying to staging environment"

      - name: Deploy to Production
        if: github.ref == 'refs/heads/prod'
        run: |
          echo "Deploying to production environment"

      - name: Send failure email (on failure)
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" -d '{"to": "balajikannan2002@gmail.com", "subject": "Build failed", "body": "The build for the branch ${GITHUB_REF} has failed."}' \
          -u "api:${{ secrets.MAILGUN_API_KEY }}" \
          https://api.mailgun.net/v3/${{ secrets.MAILGUN_DOMAIN }}/messages
